name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Frontend
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Go
        run: |
          go vet ./...
          go test ./...
      - name: Installer
        run: bash -n scripts/install.sh && shellcheck -S warning scripts/install.sh
