# Админка + PostgreSQL. Вариант с одной SQLite - docker-compose.sqlite.yml.
# Снаружи - только через HTTPS-прокси (Caddy, nginx); без него задайте FTA_COOKIE_SECURE=false и слушайте 127.0.0.1.
services:
  admin:
    build: .
    image: freeturn-admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FTA_DB_DRIVER: postgres
      FTA_DB_DSN: postgres://freeturn:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/freeturn?sslmode=disable
      FTA_ADMIN_LOGIN: ${FTA_ADMIN_LOGIN:-}
      FTA_ADMIN_PASSWORD: ${FTA_ADMIN_PASSWORD:-}
      FTA_COOKIE_SECURE: ${FTA_COOKIE_SECURE:-true}
      FTA_TRUST_PROXY: ${FTA_TRUST_PROXY:-false}
    volumes:
      - admin-data:/data   # тут мастер-ключ шифрования секретов: без него секреты в БД не расшифровать
    ports:
      - "127.0.0.1:${FTA_PORT:-8080}:8080"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freeturn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: freeturn
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeturn -d freeturn"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  admin-data:
  db-data:
