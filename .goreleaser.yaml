version: 2
project_name: freeturn-admin
before:
  hooks:
    # Фронт встраивается в бинарник (web/embed.go) - собираем до go build.
    - sh -c "cd web && npm ci && npm run build"
builds:
  - main: ./cmd/freeturn-admin
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: SHA256SUMS.txt
release:
  # Установщик - тем же релизом: .../releases/latest/download/install.sh
  extra_files:
    - glob: scripts/install.sh
